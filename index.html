<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Glass Work</title>
    
    <!-- React & Tailwind CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js" crossorigin></script>
    
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3); }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .table-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .table-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-gradient { background: linear-gradient(135deg, #312e81 0%, #4f46e5 100%); }
        .card-gradient { background: linear-gradient(to right bottom, #ffffff, #f8fafc); }

        /* Blueprint Patterns */
        .pattern-glass { background-color: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.5); }
        .pattern-frosted { 
            background: repeating-linear-gradient( 45deg, rgba(255,255,255,0.7), rgba(255,255,255,0.7) 10px, rgba(56, 189, 248, 0.2) 10px, rgba(56, 189, 248, 0.2) 20px );
            border: 1px solid rgba(56, 189, 248, 0.8);
        }
        .pattern-paper {
            background-color: rgba(14, 165, 233, 0.3); backdrop-filter: blur(4px);
            background-image: radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 10px 10px;
        }

        /* --- Strict & COLORFUL Print CSS --- */
        @media print {
            * { -webkit-print-color-adjust: exact !important; color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white !important; font-size: 10pt !important; padding: 0 !important; margin: 0 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #invoice-paper { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
            table { width: 100% !important; border-collapse: collapse !important; border: 1px solid #e2e8f0 !important; }
            th, td { border: 1px solid #e2e8f0 !important; padding: 8px 10px !important; }
            .page-break { page-break-inside: avoid; }
            .avoid-break-inside { page-break-inside: avoid; }
            @page { margin: 8mm; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const defaultRates = {
            glass12mm: 150, glass8mm: 120, glass6mm: 90, tempering: 60, design: 45, glassPaper: 40, labour: 30,
            profileD48A: 250, profileD48B: 200, profileD48: 180, profileUGola: 100, profileNone: 0,
            machine: 8500, lPatch: 1500, handle: 3500, lock: 2500, ggJoint: 1200, wgJoint: 800, silicone: 900
        };
        const defaultCompany = { 
            name: "AL-MADINA GLASS", 
            address: "Shop No 12, Main Market, City", 
            phone: "0300-1234567", logoUrl: "", 
            notes: "1. 70% Advance required for order.\n2. Valid for 7 days.\n3. Final bill based on actual size." 
        };

        function App() {
            const [tab, setTab] = useState('create'); 
            const [rates, setRates] = useState(defaultRates);
            const [company, setCompany] = useState(defaultCompany);
            const [savedQuotes, setSavedQuotes] = useState([]);
            const [currentQuoteId, setCurrentQuoteId] = useState(null);
            const [customer, setCustomer] = useState({ name: '', phone: '', address: '', date: new Date().toISOString().split('T')[0] });
            const [partitions, setPartitions] = useState([]);
            const [financials, setFinancials] = useState({ discount: 0, advance: 0, taxPercent: 0, transport: 0 });

            useEffect(() => {
                const lsRates = localStorage.getItem('cad_glass_rates');
                const lsCompany = localStorage.getItem('cad_glass_comp');
                const lsQuotes = localStorage.getItem('cad_glass_quotes');
                if(lsRates) setRates({...defaultRates, ...JSON.parse(lsRates)}); // Merge to ensure new fields like glassPaper exist
                if(lsCompany) setCompany(JSON.parse(lsCompany));
                if(lsQuotes) setSavedQuotes(JSON.parse(lsQuotes));
            }, []);

            const updateSettings = (newRates, newCompany) => {
                setRates(newRates); setCompany(newCompany);
                localStorage.setItem('cad_glass_rates', JSON.stringify(newRates));
                localStorage.setItem('cad_glass_comp', JSON.stringify(newCompany));
                alert("Settings Saved Successfully!");
            };

            const saveCurrentQuote = () => {
                if (partitions.length === 0) return alert("Please add items to save the bill.");
                const quoteToSave = { id: currentQuoteId || Date.now().toString(), status: 'Pending', customer, partitions, financials, timestamp: new Date().toLocaleString() };
                let updatedQuotes;
                if(currentQuoteId) {
                    const existingQuote = savedQuotes.find(q => q.id === currentQuoteId);
                    if(existingQuote) quoteToSave.status = existingQuote.status;
                    updatedQuotes = savedQuotes.map(q => q.id === currentQuoteId ? quoteToSave : q);
                } else {
                    updatedQuotes = [quoteToSave, ...savedQuotes];
                    setCurrentQuoteId(quoteToSave.id);
                }
                setSavedQuotes(updatedQuotes);
                localStorage.setItem('cad_glass_quotes', JSON.stringify(updatedQuotes));
                alert("Quotation Saved Successfully!");
            };

            const updateQuoteStatus = (id, newStatus) => {
                const updatedQuotes = savedQuotes.map(q => q.id === id ? { ...q, status: newStatus } : q);
                setSavedQuotes(updatedQuotes);
                localStorage.setItem('cad_glass_quotes', JSON.stringify(updatedQuotes));
            };

            const loadQuote = (quote) => { setCustomer(quote.customer); setPartitions(quote.partitions); setFinancials(quote.financials); setCurrentQuoteId(quote.id); setTab('preview'); };
            const deleteQuote = (id) => { if(confirm("Delete this quote?")) { const updated = savedQuotes.filter(q => q.id !== id); setSavedQuotes(updated); localStorage.setItem('cad_glass_quotes', JSON.stringify(updated)); if(currentQuoteId === id) startNewQuote(); } };
            const startNewQuote = () => { if(partitions.length > 0 && !confirm("Start new? Current data will clear.")) return; setCustomer({ name: '', phone: '', address: '', date: new Date().toISOString().split('T')[0] }); setPartitions([]); setFinancials({ discount: 0, advance: 0, taxPercent: 0, transport: 0 }); setCurrentQuoteId(null); setTab('create'); };

            // Calculations
            let subTotal = 0;
            partitions.forEach(p => {
                const area = (p.totalWidth * p.totalHeight) / 144;
                let glassRate = rates[`glass${p.thickness}`] + (p.isTempered?rates.tempering:0) + (p.isDesigned?rates.design:0) + (p.isGlassPaper?rates.glassPaper:0) + (p.isLabour?rates.labour:0);
                subTotal += (area * glassRate);
                if(p.topProfile !== 'profileNone') subTotal += (p.totalWidth/12) * rates[p.topProfile];
                if(p.bottomProfile !== 'profileNone') subTotal += (p.totalWidth/12) * rates[p.bottomProfile];
                if(p.sideProfile !== 'profileNone') subTotal += (p.totalHeight/12 * 2) * rates[p.sideProfile];
                subTotal += (p.machineQty * rates.machine) + (p.lPatchQty * rates.lPatch) + (p.handleQty * rates.handle) + (p.lockQty * rates.lock) + (p.ggJointQty * rates.ggJoint) + (p.wgJointQty * rates.wgJoint) + (p.siliconeQty * rates.silicone);
            });
            const taxAmount = (subTotal * financials.taxPercent) / 100;
            const grandTotal = subTotal + taxAmount + (financials.transport || 0) - financials.discount;
            const balance = grandTotal - financials.advance;

            return (
                <div className="min-h-screen pb-20 md:pb-0 font-sans">
                    <header className="glass-gradient text-white shadow-lg sticky top-0 z-40 no-print">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-sm shadow-inner text-2xl">📐</div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-black tracking-tight drop-shadow-md">PROFESSIONAL GLASS WORK</h1>
                                    <p className="text-[9px] uppercase tracking-widest text-cyan-200 font-bold -mt-1">Pro Max Visualizer</p>
                                </div>
                            </div>
                            <div className="hidden md:flex space-x-1.5 bg-black/20 p-1.5 rounded-xl backdrop-blur-md border border-white/10">
                                <NavBtn active={tab==='create'} onClick={()=>setTab('create')} icon="✏️" text="CAD Builder" />
                                <NavBtn active={tab==='preview'} onClick={()=>setTab('preview')} icon="🧾" text="Invoice" />
                                <NavBtn active={tab==='saved'} onClick={()=>setTab('saved')} icon="💾" text="Saved" badge={savedQuotes.length} />
                                <NavBtn active={tab==='settings'} onClick={()=>setTab('settings')} icon="⚙️" text="Settings" />
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1400px] mx-auto p-3 md:p-6 w-full">
                        {tab === 'create' && <Builder rates={rates} partitions={partitions} setPartitions={setPartitions} customer={customer} setCustomer={setCustomer} financials={financials} setFinancials={setFinancials} total={grandTotal} itemsCount={partitions.length} />}
                        {tab === 'preview' && <InvoicePreview company={company} customer={customer} partitions={partitions} rates={rates} financials={financials} subTotal={subTotal} taxAmount={taxAmount} grandTotal={grandTotal} balance={balance} saveCurrentQuote={saveCurrentQuote} startNewQuote={startNewQuote} quoteId={currentQuoteId} />}
                        {tab === 'saved' && <SavedQuotes quotes={savedQuotes} loadQuote={loadQuote} deleteQuote={deleteQuote} updateQuoteStatus={updateQuoteStatus} />}
                        {tab === 'settings' && <Settings initialRates={rates} initialCompany={company} updateSettings={updateSettings} />}
                    </main>

                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.1)] z-50 flex justify-around p-2 pb-safe no-print">
                        <MobileNavBtn active={tab==='create'} onClick={()=>setTab('create')} icon="✏️" text="Build" />
                        <MobileNavBtn active={tab==='preview'} onClick={()=>setTab('preview')} icon="🧾" text="Invoice" />
                        <MobileNavBtn active={tab==='saved'} onClick={()=>setTab('saved')} icon="💾" text="Saved" badge={savedQuotes.length} />
                        <MobileNavBtn active={tab==='settings'} onClick={()=>setTab('settings')} icon="⚙️" text="Settings" />
                    </nav>
                </div>
            );
        }

        const NavBtn = ({active, onClick, icon, text, badge}) => (
            <button onClick={onClick} className={`px-5 py-2 rounded-lg font-bold text-sm transition flex items-center gap-2 ${active ? 'bg-white text-indigo-700 shadow-md transform scale-105' : 'text-white/80 hover:bg-white/20 hover:text-white'}`}>
                <span>{icon}</span> {text}
                {badge > 0 && <span className="bg-cyan-400 text-cyan-900 text-[10px] font-black px-2 py-0.5 rounded-full ml-1 shadow-sm">{badge}</span>}
            </button>
        );
        const MobileNavBtn = ({active, onClick, icon, text, badge}) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-2 transition-colors ${active ? 'text-indigo-600' : 'text-gray-400'}`}>
                <div className="relative text-2xl mb-1">{icon}{badge > 0 && <span className="absolute -top-2 -right-3 bg-cyan-500 text-white text-[10px] w-4 h-4 flex justify-center items-center rounded-full font-bold shadow">{badge}</span>}</div>
                <span className="text-[11px] font-bold tracking-wide">{text}</span>
            </button>
        );

        // --- CAD BLUEPRINT COMPONENT (2D Schematic Visualizer) ---
        // Ye component width, height aur door details k hisab se drawing banayega
        function CADBlueprint({ data }) {
            const tW = parseFloat(data.totalWidth) || 0;
            const tH = parseFloat(data.totalHeight) || 0;
            const dW = parseFloat(data.doorWidth) || 0;
            const dH = parseFloat(data.doorHeight) || 0;

            if (tW === 0 || tH === 0) {
                return (
                    <div className="w-full h-48 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-400 font-bold flex-col">
                        <span className="text-4xl mb-2">📐</span> Enter sizes to see CAD Preview
                    </div>
                );
            }

            // Determine Pattern
            let patternClass = "pattern-glass";
            if (data.isDesigned) patternClass = "pattern-frosted";
            if (data.isGlassPaper) patternClass = "pattern-paper";

            // Relative sizes for drawing
            const glassPanelClass = `flex-1 relative flex items-center justify-center ${patternClass}`;

            const renderDoor = (isLeft=false, isRight=false) => (
                <div style={{ width: dW?`${(dW/tW)*100}%`:'100%', height: dH?`${(dH/tH)*100}%`:'100%', marginTop: 'auto' }} className={`relative border-2 border-indigo-400 bg-indigo-50/20 shadow-inner flex items-center justify-center ${patternClass}`}>
                    <span className="text-[8px] md:text-xs font-black text-indigo-700 bg-white/70 px-1 rounded backdrop-blur">Door</span>
                    
                    {/* Hardware Nodes on Door */}
                    {data.machineQty > 0 && <div className="absolute -bottom-2 left-2 w-4 h-3 bg-gray-800 rounded-sm shadow border border-gray-600" title="Machine"></div>}
                    {data.lPatchQty > 0 && <div className="absolute top-1 left-1 w-3 h-4 bg-gray-400 rounded-sm shadow border border-gray-600" title="L-Patch"></div>}
                    {data.handleQty > 0 && <div className={`absolute top-1/2 -translate-y-1/2 ${isLeft?'left-2':'right-2'} w-1.5 h-16 bg-slate-300 border border-slate-500 rounded-full shadow-lg`} title="Handle"></div>}
                    {data.lockQty > 0 && <div className="absolute bottom-1 right-1/2 translate-x-1/2 w-4 h-2 bg-gray-500 rounded shadow" title="Lock"></div>}
                </div>
            );

            return (
                <div className="w-full bg-slate-900 rounded-xl p-4 shadow-inner relative overflow-hidden">
                    <p className="text-cyan-400 text-[10px] font-black uppercase tracking-widest mb-2 text-center">CAD Structural Preview</p>
                    
                    {/* The Drawing Area */}
                    <div className="relative mx-auto border-4 border-slate-600 bg-slate-800 flex items-end overflow-hidden" 
                         style={{ aspectRatio: `${tW}/${tH}`, maxHeight: '250px', maxWidth: '100%' }}>
                        
                        {data.type === 'Fix' && (
                            <div className={`w-full h-full relative flex items-center justify-center ${patternClass}`}>
                                <span className="text-xs font-black text-slate-800 bg-white/70 px-2 py-1 rounded backdrop-blur">Fixed Glass</span>
                            </div>
                        )}

                        {data.type === 'Single Door' && (
                            <div className="w-full h-full flex items-end gap-0.5 relative">
                                {/* Fixed side if door is smaller than total */}
                                {dW > 0 && dW < tW && <div className={glassPanelClass}><span className="text-[10px] font-black text-slate-800 bg-white/70 px-1 rounded">Fix</span></div>}
                                {renderDoor()}
                            </div>
                        )}

                        {data.type === 'Double Door' && (
                            <div className="w-full h-full flex items-end gap-0.5 relative">
                                {/* Left Fix if space allows */}
                                {dW > 0 && (dW*2) < tW && <div className={glassPanelClass}><span className="text-[10px] font-black text-slate-800 bg-white/70 px-1 rounded hidden md:block">Fix</span></div>}
                                
                                {renderDoor(true, false)}
                                {renderDoor(false, true)}

                                {/* Right Fix if space allows */}
                                {dW > 0 && (dW*2) < tW && <div className={glassPanelClass}><span className="text-[10px] font-black text-slate-800 bg-white/70 px-1 rounded hidden md:block">Fix</span></div>}
                            </div>
                        )}

                        {/* Outer Profiles Overlay */}
                        {data.topProfile !== 'profileNone' && <div className="absolute top-0 left-0 right-0 h-1.5 bg-gray-300"></div>}
                        {data.bottomProfile !== 'profileNone' && <div className="absolute bottom-0 left-0 right-0 h-1.5 bg-gray-300"></div>}
                        {data.sideProfile !== 'profileNone' && <><div className="absolute top-0 bottom-0 left-0 w-1.5 bg-gray-300"></div><div className="absolute top-0 bottom-0 right-0 w-1.5 bg-gray-300"></div></>}
                    </div>
                    
                    <div className="mt-3 flex justify-between text-[10px] text-slate-400 font-bold">
                        <span>W: {tW}"</span>
                        <span>H: {tH}"</span>
                    </div>
                </div>
            );
        }

        // --- 1. Builder Component ---
        function Builder({ rates, partitions, setPartitions, customer, setCustomer, financials, setFinancials, total, itemsCount }) {
            const [form, setForm] = useState({
                type: 'Single Door', thickness: '12mm', 
                totalWidth: '', totalHeight: '', doorWidth: '', doorHeight: '', partitionNotes: '',
                topProfile: 'profileD48A', bottomProfile: 'profileD48A', sideProfile: 'profileUGola',
                isTempered: true, isDesigned: false, isGlassPaper: false, isLabour: true,
                machineQty: 1, lPatchQty: 1, handleQty: 1, lockQty: 1, ggJointQty: 0, wgJointQty: 0, siliconeQty: 1
            });

            const handleTypeChange = (e) => {
                const type = e.target.value; let updates = { type };
                if (type === 'Fix') updates = { ...updates, machineQty: 0, lPatchQty: 0, handleQty: 0, lockQty: 0, doorWidth: '', doorHeight: '' };
                else if (type === 'Single Door') updates = { ...updates, machineQty: 1, lPatchQty: 1, handleQty: 1, lockQty: 1 };
                else if (type === 'Double Door') updates = { ...updates, machineQty: 2, lPatchQty: 2, handleQty: 2, lockQty: 2 };
                setForm({ ...form, ...updates });
            };

            const addPartition = () => {
                if (!form.totalWidth || !form.totalHeight) return alert("Total Width & Height required!");
                setPartitions([...partitions, { 
                    id: Date.now(), ...form, 
                    totalWidth: parseFloat(form.totalWidth), totalHeight: parseFloat(form.totalHeight),
                    doorWidth: form.doorWidth ? parseFloat(form.doorWidth) : null, doorHeight: form.doorHeight ? parseFloat(form.doorHeight) : null
                }]);
                setForm({...form, totalWidth: '', totalHeight: '', doorWidth: '', doorHeight: '', partitionNotes: ''}); 
            };

            const inputStyle = "w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:bg-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 font-semibold shadow-sm bg-slate-50";
            const labelStyle = "text-[10px] font-black text-slate-500 mb-1 block uppercase tracking-wider";

            return (
                <div className="flex flex-col lg:flex-row gap-6">
                    <div className="w-full lg:w-[60%] space-y-6">
                        
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="bg-slate-50 px-5 py-3 border-b border-slate-200"><h2 className="text-sm font-black text-slate-700 uppercase tracking-widest flex items-center">👤 Client Details</h2></div>
                            <div className="p-5 grid grid-cols-2 gap-4">
                                <div className="col-span-2 md:col-span-1"><label className={labelStyle}>Client Name</label><input className={inputStyle} value={customer.name} onChange={e=>setCustomer({...customer, name: e.target.value})} /></div>
                                <div className="col-span-2 md:col-span-1"><label className={labelStyle}>Phone No.</label><input className={inputStyle} value={customer.phone} onChange={e=>setCustomer({...customer, phone: e.target.value})} /></div>
                                <div><label className={labelStyle}>Date</label><input type="date" className={inputStyle} value={customer.date} onChange={e=>setCustomer({...customer, date: e.target.value})} /></div>
                                <div className="col-span-2"><label className={labelStyle}>Site / Location Address</label><input className={inputStyle} value={customer.address} onChange={e=>setCustomer({...customer, address: e.target.value})} /></div>
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border-2 border-indigo-100 overflow-hidden">
                            <div className="bg-indigo-50 px-6 py-4 border-b border-indigo-100"><h2 className="text-sm font-black text-indigo-900 uppercase tracking-widest flex items-center">📐 Virtual CAD Builder</h2></div>
                            
                            <div className="flex flex-col md:flex-row">
                                {/* Form Area */}
                                <div className="p-5 flex-1 space-y-5 border-r border-indigo-50">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className={labelStyle}>Structure</label><select className={`${inputStyle} bg-indigo-50 border-indigo-200 text-indigo-900`} value={form.type} onChange={handleTypeChange}><option>Single Door</option><option>Double Door</option><option>Fix</option></select></div>
                                        <div><label className={labelStyle}>Glass</label><select className={inputStyle} value={form.thickness} onChange={e=>setForm({...form, thickness: e.target.value})}><option>12mm</option><option>8mm</option><option>6mm</option></select></div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div className="col-span-2 text-[10px] font-black text-indigo-600 uppercase">Total Overall Size</div>
                                        <div><input type="number" className="w-full p-2 border-2 border-indigo-200 rounded-lg font-black text-center" value={form.totalWidth} onChange={e=>setForm({...form, totalWidth: e.target.value})} placeholder="Width" /></div>
                                        <div><input type="number" className="w-full p-2 border-2 border-indigo-200 rounded-lg font-black text-center" value={form.totalHeight} onChange={e=>setForm({...form, totalHeight: e.target.value})} placeholder="Height" /></div>
                                        
                                        {form.type !== 'Fix' && (
                                            <>
                                                <div className="col-span-2 text-[10px] font-black text-cyan-600 uppercase mt-2 border-t pt-2">Door / Panel Size</div>
                                                <div><input type="number" className="w-full p-2 border border-cyan-200 rounded-lg font-bold text-center" value={form.doorWidth} onChange={e=>setForm({...form, doorWidth: e.target.value})} placeholder="Dr W" /></div>
                                                <div><input type="number" className="w-full p-2 border border-cyan-200 rounded-lg font-bold text-center" value={form.doorHeight} onChange={e=>setForm({...form, doorHeight: e.target.value})} placeholder="Dr H" /></div>
                                            </>
                                        )}
                                    </div>

                                    <div className="flex flex-wrap gap-x-4 gap-y-2 py-3 px-4 border border-cyan-100 bg-cyan-50/50 rounded-xl">
                                        <label className="flex items-center space-x-1.5 text-xs font-bold text-slate-700 cursor-pointer"><input type="checkbox" checked={form.isTempered} onChange={e=>setForm({...form, isTempered: e.target.checked})} className="w-4 h-4 text-indigo-600"/><span>Tempered</span></label>
                                        <label className="flex items-center space-x-1.5 text-xs font-bold text-slate-700 cursor-pointer"><input type="checkbox" checked={form.isDesigned} onChange={e=>setForm({...form, isDesigned: e.target.checked})} className="w-4 h-4 text-indigo-600"/><span>Frosting</span></label>
                                        <label className="flex items-center space-x-1.5 text-xs font-bold text-sky-700 cursor-pointer"><input type="checkbox" checked={form.isGlassPaper} onChange={e=>setForm({...form, isGlassPaper: e.target.checked})} className="w-4 h-4 text-sky-600"/><span>Glass Paper</span></label>
                                        <label className="flex items-center space-x-1.5 text-xs font-bold text-slate-700 cursor-pointer"><input type="checkbox" checked={form.isLabour} onChange={e=>setForm({...form, isLabour: e.target.checked})} className="w-4 h-4 text-indigo-600"/><span>Labour</span></label>
                                    </div>
                                    
                                    {/* Profiles & Hardware Accordion Style */}
                                    <div className="space-y-4">
                                        <div>
                                            <label className={labelStyle}>Aluminum Frame Profiles</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                <select className="w-full p-2 border rounded text-[11px] font-bold bg-white" value={form.topProfile} onChange={e=>setForm({...form, topProfile: e.target.value})}><option value="profileNone">No Top</option><option value="profileD48A">Top D48A</option><option value="profileD48B">Top D48B</option><option value="profileD48">Top D48</option><option value="profileUGola">Top Gola</option></select>
                                                <select className="w-full p-2 border rounded text-[11px] font-bold bg-white" value={form.bottomProfile} onChange={e=>setForm({...form, bottomProfile: e.target.value})}><option value="profileNone">No Btm</option><option value="profileD48A">Btm D48A</option><option value="profileD48B">Btm D48B</option><option value="profileD48">Btm D48</option><option value="profileUGola">Btm Gola</option></select>
                                                <select className="w-full p-2 border rounded text-[11px] font-bold bg-white" value={form.sideProfile} onChange={e=>setForm({...form, sideProfile: e.target.value})}><option value="profileNone">No Sides</option><option value="profileD48A">Side D48A</option><option value="profileD48B">Side D48B</option><option value="profileD48">Side D48</option><option value="profileUGola">Side Gola</option></select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className={labelStyle}>Hardware / Accessories</label>
                                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                                {[{l:'Machine', k:'machineQty'}, {l:'L-Patch', k:'lPatchQty'}, {l:'Handle', k:'handleQty'}, {l:'Lock', k:'lockQty'}, {l:'G-Joint', k:'ggJointQty'}, {l:'W-Joint', k:'wgJointQty'}].map(hw => (
                                                    <div key={hw.k} className="text-center"><label className="text-[9px] text-slate-500 font-bold block truncate">{hw.l}</label><input type="number" min="0" value={form[hw.k]} onChange={e=>setForm({...form, [hw.k]: parseInt(e.target.value)||0})} className="w-full p-1 text-center bg-white border border-slate-300 rounded text-xs font-black text-indigo-700"/></div>
                                                ))}
                                                <div className="text-center col-span-2 sm:col-span-2"><label className="text-[9px] text-slate-500 font-bold block truncate">Silicone (Tube)</label><input type="number" min="0" value={form.siliconeQty} onChange={e=>setForm({...form, siliconeQty: parseInt(e.target.value)||0})} className="w-full p-1 text-center bg-white border border-slate-300 rounded text-xs font-black text-indigo-700"/></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className={labelStyle}>Special Instructions</label>
                                        <input type="text" className={inputStyle} value={form.partitionNotes} onChange={e=>setForm({...form, partitionNotes: e.target.value})} placeholder="e.g. Handle on left, pattern horizontal..." />
                                    </div>
                                    
                                </div>
                                
                                {/* Right Side Panel (Preview & Action) */}
                                <div className="w-full md:w-64 bg-slate-50 p-5 flex flex-col justify-center">
                                    <CADBlueprint data={form} />
                                    <button onClick={addPartition} className="mt-6 w-full py-4 glass-gradient text-white font-black tracking-widest uppercase rounded-xl shadow-lg transition transform active:scale-[0.98] hover:shadow-indigo-300 flex items-center justify-center gap-2">
                                        <span className="text-xl">+</span> Add Setup
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="w-full lg:w-[40%] flex flex-col gap-6">
                        <div className="glass-gradient rounded-3xl shadow-lg p-6 text-white relative overflow-hidden flex flex-col justify-center">
                            <div className="relative z-10">
                                <p className="text-white/80 text-xs font-black uppercase tracking-widest mb-1">Total Bill Estimate</p>
                                <h2 className="text-4xl font-black tracking-tight drop-shadow-md">Rs. {Math.round(total).toLocaleString()}</h2>
                                <span className="mt-2 inline-block bg-white/20 px-3 py-1 rounded-lg text-xs font-bold shadow-sm">{itemsCount} Partitions in Cart</span>
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                            <div className="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2"><span>🛒</span> Invoice Cart</h2>
                                {partitions.length > 0 && <button onClick={()=>setPartitions([])} className="text-rose-500 text-xs font-bold hover:bg-rose-50 px-3 py-1 rounded-full transition">Clear All</button>}
                            </div>
                            <div className="p-4 space-y-3 overflow-y-auto max-h-[40vh] md:max-h-[500px] table-scroll">
                                {partitions.length === 0 ? (
                                    <div className="text-center py-12 text-slate-300 font-bold">No setups added yet.</div>
                                ) : (
                                    partitions.map((p, idx) => (
                                        <div key={p.id} className="bg-white border-2 border-slate-100 rounded-2xl p-4 shadow-sm relative hover:border-indigo-300 transition-colors flex gap-4">
                                            <button onClick={()=>setPartitions(partitions.filter(x=>x.id!==p.id))} className="absolute top-3 right-3 text-slate-400 hover:text-rose-500 bg-slate-50 rounded-full w-6 h-6 flex items-center justify-center font-bold">X</button>
                                            <div className="bg-indigo-100 text-indigo-700 font-black w-8 h-8 rounded-lg flex items-center justify-center shrink-0">{idx+1}</div>
                                            <div className="flex-1">
                                                <h3 className="font-black text-slate-800">{p.type}</h3>
                                                <p className="text-[11px] font-bold text-slate-500 mt-1">Area: {((p.totalWidth*p.totalHeight)/144).toFixed(1)} Sq.ft | {p.thickness} {p.isGlassPaper?'(+ Paper)':''}</p>
                                                {/* Mini preview for cart */}
                                                <div className="mt-2 w-24"><CADBlueprint data={p} /></div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-5">
                            <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-2 mb-3">Accounts / Finance</h3>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                <div><label className="text-[9px] font-bold text-slate-500 block mb-1 uppercase">GST (%)</label><input type="number" className="w-full p-2 border border-slate-200 rounded-lg text-center font-bold" value={financials.taxPercent} onChange={e=>setFinancials({...financials, taxPercent: parseFloat(e.target.value)||0})} placeholder="0" /></div>
                                <div><label className="text-[9px] font-bold text-orange-500 block mb-1 uppercase">Transport</label><input type="number" className="w-full p-2 border border-orange-200 bg-orange-50 rounded-lg text-center font-bold text-orange-600" value={financials.transport || ''} onChange={e=>setFinancials({...financials, transport: parseFloat(e.target.value)||0})} placeholder="0" /></div>
                                <div><label className="text-[9px] font-bold text-rose-500 block mb-1 uppercase">Discount</label><input type="number" className="w-full p-2 border border-rose-200 bg-rose-50 rounded-lg text-center font-bold text-rose-600" value={financials.discount || ''} onChange={e=>setFinancials({...financials, discount: parseFloat(e.target.value)||0})} placeholder="0" /></div>
                                <div><label className="text-[9px] font-bold text-emerald-500 block mb-1 uppercase">Advance</label><input type="number" className="w-full p-2 border border-emerald-200 bg-emerald-50 rounded-lg text-center font-bold text-emerald-600" value={financials.advance || ''} onChange={e=>setFinancials({...financials, advance: parseFloat(e.target.value)||0})} placeholder="0" /></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 2. PROFESSIONAL & COLORFUL INVOICE COMPONENT ---
        function InvoicePreview({ company, customer, partitions, rates, financials, subTotal, taxAmount, grandTotal, balance, saveCurrentQuote, startNewQuote, quoteId }) {
            const printBill = () => window.print();

            let totalGlassCost = 0; let totalProfileCost = 0; let totalHardwareCost = 0; let totalGlassPaperCost = 0;

            const renderRows = () => {
                if (partitions.length === 0) return <tr><td colSpan="7" className="text-center py-16 text-slate-400 font-black uppercase tracking-widest border-b border-slate-200">No items added</td></tr>;
                
                let rows = []; let pNumber = 1;
                const profMap = { profileD48A: 'D48-A', profileD48B: 'D48-B', profileD48: 'D48 Std', profileUGola: 'U-Gola' };

                partitions.forEach((p, pIdx) => {
                    const area = (p.totalWidth * p.totalHeight) / 144;
                    const wRft = p.totalWidth / 12;
                    const hRft = p.totalHeight / 12;
                    let partitionSubTotal = 0;
                    
                    // Main Partition Row 
                    rows.push(
                        <tr key={`h-${p.id}`} className="print-dark bg-indigo-600 text-white border-b-2 border-indigo-800">
                            <td className="font-black text-center py-3 text-lg border-r border-indigo-400">{pNumber++}</td>
                            <td colSpan="6" className="font-black uppercase tracking-widest text-sm py-3 px-4">
                                {p.type} 
                                <span className="ml-3 font-semibold normal-case text-xs bg-indigo-800/50 px-2 py-1 rounded">Size: {p.totalWidth}" W x {p.totalHeight}" H</span>
                                {p.doorWidth && <span className="ml-2 font-bold normal-case text-xs bg-yellow-400 text-black px-2 py-1 rounded">Door: {p.doorWidth}"x{p.doorHeight}"</span>}
                            </td>
                        </tr>
                    );

                    // --- Blueprint Row (Visual Schematic inside Invoice) ---
                    rows.push(
                        <tr key={`blueprint-${p.id}`} className="bg-slate-50 border-b border-slate-200 print-light avoid-break-inside">
                            <td className="border-r border-slate-200 text-center text-xs text-slate-400 font-bold">CAD</td>
                            <td colSpan="6" className="py-4 px-6 flex items-center justify-between">
                                <div className="w-full max-w-[200px] print:max-w-[150px]">
                                    <CADBlueprint data={p} />
                                </div>
                                {p.partitionNotes && (
                                    <div className="ml-4 flex-1 bg-white p-3 border-l-4 border-orange-400 rounded shadow-sm">
                                        <p className="text-[10px] font-black text-orange-500 uppercase tracking-widest mb-1">Engineer Notes:</p>
                                        <p className="text-xs font-bold text-slate-700">{p.partitionNotes}</p>
                                    </div>
                                )}
                            </td>
                        </tr>
                    );

                    // --- 1. Glass Row ---
                    let gRate = rates[`glass${p.thickness}`] + (p.isTempered?rates.tempering:0) + (p.isDesigned?rates.design:0) + (p.isLabour?rates.labour:0);
                    let gDesc = `${p.thickness} Glass ${p.isTempered?'+ Tempered':''} ${p.isDesigned?'+ Frost':''} ${p.isLabour?'+ Fixing':''}`;
                    let gAmount = area * gRate;
                    partitionSubTotal += gAmount; totalGlassCost += gAmount;
                    
                    rows.push(
                        <tr key={`g-${p.id}`} className="border-b border-slate-200 text-slate-800 bg-white">
                            <td className="text-center text-xs font-black text-slate-400 border-r border-slate-200"></td>
                            <td className="font-bold text-xs pl-4 text-indigo-900">♦ {gDesc}</td>
                            <td className="text-center font-bold text-indigo-600">{area.toFixed(2)}</td>
                            <td className="text-center text-xs font-bold text-slate-500">Sq.Ft</td>
                            <td className="text-right font-medium text-slate-500">{gRate}</td>
                            <td className="text-right font-black text-slate-800">{Math.round(gAmount).toLocaleString()}</td>
                        </tr>
                    );

                    // --- 1b. Glass Paper Row ---
                    if(p.isGlassPaper) {
                        let paperAmt = area * rates.glassPaper;
                        partitionSubTotal += paperAmt; totalGlassPaperCost += paperAmt;
                        rows.push(
                            <tr key={`gp-${p.id}`} className="border-b border-slate-200 text-slate-800 bg-cyan-50/50 print-light">
                                <td className="text-center text-xs font-black text-slate-400 border-r border-slate-200"></td>
                                <td className="font-bold text-xs pl-4 text-cyan-800">♦ Glass Paper / Film Overlay</td>
                                <td className="text-center font-bold text-cyan-700">{area.toFixed(2)}</td>
                                <td className="text-center text-xs font-bold text-slate-500">Sq.Ft</td>
                                <td className="text-right font-medium text-slate-500">{rates.glassPaper}</td>
                                <td className="text-right font-black text-cyan-900">{Math.round(paperAmt).toLocaleString()}</td>
                            </tr>
                        );
                    }

                    // --- 2. Profiles ---
                    const addProfileRow = (type, key, label, qty) => {
                        if(key === 'profileNone') return;
                        let amt = qty * rates[key];
                        partitionSubTotal += amt; totalProfileCost += amt;
                        rows.push(
                            <tr key={`p-${type}-${p.id}`} className="border-b border-slate-100 text-slate-700 bg-white">
                                <td className="text-center border-r border-slate-200"></td>
                                <td className="font-medium text-xs pl-8">▫️ {label}: {profMap[key]}</td>
                                <td className="text-center font-bold">{qty.toFixed(2)}</td>
                                <td className="text-center text-[10px] font-bold text-slate-400">Rft</td>
                                <td className="text-right font-medium text-slate-500">{rates[key]}</td>
                                <td className="text-right font-bold text-slate-700">{Math.round(amt).toLocaleString()}</td>
                            </tr>
                        );
                    };
                    addProfileRow('top', p.topProfile, 'Top Profile', wRft);
                    addProfileRow('btm', p.bottomProfile, 'Bottom Profile', wRft);
                    addProfileRow('side', p.sideProfile, 'Side Profiles (L+R)', hRft*2);

                    // --- 3. Hardware ---
                    const hwItems = [
                        {qty: p.machineQty, name: 'Machine (Floor Spring)', rate: rates.machine, unit: 'Pcs'}, 
                        {qty: p.lPatchQty, name: 'L-Patch', rate: rates.lPatch, unit: 'Pcs'},
                        {qty: p.handleQty, name: 'Door Handle', rate: rates.handle, unit: 'Pcs'}, 
                        {qty: p.lockQty, name: 'Door Lock', rate: rates.lock, unit: 'Pcs'},
                        {qty: p.ggJointQty, name: 'Glass to Glass Joint', rate: rates.ggJoint, unit: 'Pcs'}, 
                        {qty: p.wgJointQty, name: 'Wall to Glass Joint', rate: rates.wgJoint, unit: 'Pcs'},
                        {qty: p.siliconeQty, name: 'Silicone Sealant', rate: rates.silicone, unit: 'Tube'}
                    ];
                    hwItems.forEach(hw => {
                        if(hw.qty > 0) {
                            let amt = hw.qty * hw.rate;
                            partitionSubTotal += amt; totalHardwareCost += amt;
                            rows.push(
                                <tr key={`hw-${p.id}-${hw.name}`} className="border-b border-slate-100 text-slate-700 bg-white">
                                    <td className="text-center border-r border-slate-200"></td>
                                    <td className="font-medium text-xs pl-8 text-sky-800">⚙️ {hw.name}</td>
                                    <td className="text-center font-black text-sky-700">{hw.qty}</td>
                                    <td className="text-center text-[10px] font-bold text-slate-400">{hw.unit}</td>
                                    <td className="text-right font-medium text-slate-500">{hw.rate.toLocaleString()}</td>
                                    <td className="text-right font-bold text-slate-700">{Math.round(amt).toLocaleString()}</td>
                                </tr>
                            );
                        }
                    });

                    // --- Subtotal Row ---
                    rows.push(
                        <tr key={`sub-${p.id}`} className="print-bg-slate bg-slate-100 border-b-[3px] border-white">
                            <td colSpan="5" className="text-right font-black text-[10px] uppercase tracking-widest py-2 border-r border-slate-300 text-slate-500">Partition Subtotal</td>
                            <td className="text-right font-black text-indigo-900 py-2 text-sm">Rs. {Math.round(partitionSubTotal).toLocaleString()}</td>
                        </tr>
                    );
                });
                return rows;
            };

            const tableRows = renderRows(); 

            return (
                <div className="flex flex-col items-center">
                    <div className="w-full max-w-5xl flex justify-between items-center mb-6 no-print bg-white p-4 rounded-2xl shadow border border-slate-200">
                        <div className="flex gap-3">
                            <button onClick={startNewQuote} className="px-5 py-2 text-xs font-black bg-slate-100 text-slate-600 uppercase tracking-widest rounded-lg hover:bg-slate-200">New Bill</button>
                            <button onClick={saveCurrentQuote} className="px-5 py-2 text-xs font-black bg-indigo-50 text-indigo-700 uppercase tracking-widest rounded-lg hover:bg-indigo-100">💾 {quoteId ? 'Update' : 'Save'}</button>
                        </div>
                        <button onClick={printBill} className="px-8 py-2.5 text-xs font-black uppercase tracking-widest glass-gradient text-white rounded-xl shadow-lg hover:shadow-cyan-200 transition transform active:scale-95">🖨️ Print Colorful PDF</button>
                    </div>

                    <div id="invoice-paper" className="bg-white w-full max-w-5xl shadow-2xl rounded-xl p-6 md:p-12 text-slate-800">
                        
                        <div className="flex flex-col md:flex-row justify-between items-center border-b-4 border-indigo-600 pb-6 mb-6">
                            <div className="flex items-center gap-4">
                                {company.logoUrl ? (
                                    <img src={company.logoUrl} alt="Logo" className="w-20 h-20 object-contain rounded" />
                                ) : (
                                    <div className="w-16 h-16 glass-gradient rounded-xl flex items-center justify-center text-white shadow">
                                        <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                    </div>
                                )}
                                <div>
                                    <h1 className="text-3xl font-black tracking-tighter uppercase text-slate-900">{company.name}</h1>
                                    <p className="text-xs text-slate-500 mt-1 font-bold">{company.address}</p>
                                    <p className="text-xs text-indigo-600 font-bold mt-0.5">📞 {company.phone}</p>
                                </div>
                            </div>
                            <div className="text-center md:text-right mt-4 md:mt-0 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <h2 className="text-3xl font-black text-slate-300 tracking-widest uppercase mb-1">INVOICE</h2>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Date: <span className="text-slate-800">{customer.date}</span></p>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Inv No: <span className="text-slate-800">#QT-{quoteId ? quoteId.slice(-5) : Math.floor(Math.random() * 90000) + 10000}</span></p>
                            </div>
                        </div>

                        <div className="mb-6 p-5 border border-indigo-100 bg-indigo-50/40 rounded-xl flex flex-col md:flex-row justify-between print-light">
                            <div>
                                <p className="text-[9px] font-black text-indigo-500 uppercase tracking-widest mb-1">Billed To</p>
                                <p className="font-black text-xl text-slate-900 uppercase">{customer.name || 'Walk-in Customer'}</p>
                                <p className="text-xs text-slate-600 font-bold mt-1">📱 {customer.phone || 'N/A'}</p>
                            </div>
                            <div className="mt-4 md:mt-0 md:text-right">
                                <p className="text-[9px] font-black text-indigo-500 uppercase tracking-widest mb-1">Project Site / Address</p>
                                <p className="text-xs font-bold text-slate-800 max-w-xs">{customer.address || 'Location Not Provided'}</p>
                            </div>
                        </div>

                        <div className="w-full border border-slate-300 rounded-lg overflow-hidden mb-6">
                            <table className="w-full text-sm text-left border-collapse">
                                <thead className="bg-slate-100 text-slate-600 border-b-2 border-slate-300 uppercase text-[9px] tracking-widest font-black">
                                    <tr>
                                        <th className="py-3 px-2 w-10 text-center border-r border-slate-300">#</th>
                                        <th className="py-3 px-4 border-r border-slate-300">Item Detail / Material Description</th>
                                        <th className="py-3 px-2 w-16 text-center border-r border-slate-300">Qty</th>
                                        <th className="py-3 px-2 w-16 text-center border-r border-slate-300">Unit</th>
                                        <th className="py-3 px-2 w-24 text-right border-r border-slate-300">Rate</th>
                                        <th className="py-3 px-4 w-32 text-right text-slate-900">Total (Rs)</th>
                                    </tr>
                                </thead>
                                <tbody>{tableRows}</tbody>
                            </table>
                        </div>

                        <div className="flex flex-col md:flex-row justify-between items-start gap-6 mt-6 page-break">
                            {partitions.length > 0 ? (
                                <div className="w-full md:w-1/2 border border-cyan-200 rounded-xl p-5 bg-cyan-50/30 print-light">
                                    <h4 className="text-[10px] font-black text-cyan-700 uppercase tracking-widest border-b border-cyan-200 pb-2 mb-3">Cost Breakdown</h4>
                                    <div className="space-y-2 text-xs font-bold text-slate-600">
                                        <div className="flex justify-between"><span>♦ Glass Cost:</span><span className="text-slate-900 font-black">Rs. {Math.round(totalGlassCost).toLocaleString()}</span></div>
                                        {totalGlassPaperCost > 0 && <div className="flex justify-between"><span>♦ Glass Paper Cost:</span><span className="text-cyan-700 font-black">Rs. {Math.round(totalGlassPaperCost).toLocaleString()}</span></div>}
                                        <div className="flex justify-between"><span>▫️ Profiles Cost:</span><span className="text-slate-900 font-black">Rs. {Math.round(totalProfileCost).toLocaleString()}</span></div>
                                        <div className="flex justify-between"><span>⚙️ Hardware Cost:</span><span className="text-slate-900 font-black">Rs. {Math.round(totalHardwareCost).toLocaleString()}</span></div>
                                    </div>
                                </div>
                            ) : <div></div>}

                            <div className="w-full md:w-80 bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                                <table className="w-full text-xs border-none">
                                    <tbody>
                                        <tr><td className="py-1.5 text-slate-500 font-black uppercase tracking-wider text-[10px]">Sub Total</td><td className="py-1.5 text-right font-black text-slate-800 text-sm">Rs. {Math.round(subTotal).toLocaleString()}</td></tr>
                                        {financials.taxPercent > 0 && <tr><td className="py-1.5 text-slate-500 font-bold">GST ({financials.taxPercent}%)</td><td className="py-1.5 text-right font-bold text-slate-800">+ {Math.round(taxAmount).toLocaleString()}</td></tr>}
                                        {financials.transport > 0 && <tr><td className="py-1.5 text-orange-600 font-bold">Transport/Extra</td><td className="py-1.5 text-right font-bold text-orange-600">+ {financials.transport.toLocaleString()}</td></tr>}
                                        {financials.discount > 0 && <tr><td className="py-1.5 text-rose-500 font-bold">Discount</td><td className="py-1.5 text-right font-bold text-rose-600">- {financials.discount.toLocaleString()}</td></tr>}
                                        
                                        <tr className="border-t-[3px] border-indigo-600 print-dark"><td className="pt-3 pb-2 font-black text-indigo-900 uppercase tracking-widest text-sm">Grand Total</td><td className="pt-3 pb-2 text-right font-black text-xl text-indigo-900">Rs. {Math.round(grandTotal).toLocaleString()}</td></tr>
                                        
                                        {financials.advance > 0 && <tr><td className="py-2 text-emerald-500 font-black uppercase tracking-wider text-[10px]">Advance</td><td className="py-2 text-right font-black text-emerald-600 bg-emerald-50 rounded px-2">- {financials.advance.toLocaleString()}</td></tr>}
                                        {financials.advance > 0 && <tr className="border-t border-slate-200 print-bg-slate bg-slate-50"><td className="py-2 font-black uppercase text-rose-600 tracking-widest pl-2">Balance</td><td className="py-2 text-right font-black text-xl text-rose-600 pr-2">Rs. {Math.round(balance).toLocaleString()}</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="mt-12 pt-6 border-t-[3px] border-slate-200 flex flex-col md:flex-row justify-between items-end gap-8 page-break">
                            <div className="w-full md:w-2/3 bg-slate-50 p-4 rounded-xl border border-slate-200 print-light">
                                <h4 className="text-[9px] font-black uppercase tracking-widest text-indigo-600 mb-1">Terms & Conditions</h4>
                                <p className="text-[10px] text-slate-600 whitespace-pre-line leading-relaxed font-bold">{company.notes}</p>
                            </div>
                            <div className="w-full md:w-1/3 flex flex-col items-center gap-4">
                                <div className="text-center p-2 border-2 border-slate-300 rounded-lg bg-white">
                                    <svg className="w-10 h-10 mx-auto text-slate-800" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm13-2h-3v2h3v-2zm-3 4h3v2h-3v-2zm-2-6h2v2h-2v-2zm-2 2h2v2h-2v-2zm-2 2h2v2h-2v-2zm2 2h2v2h-2v-2z" /></svg>
                                    <p className="text-[6px] font-black text-slate-500 uppercase tracking-widest mt-1">Scan for Auth</p>
                                </div>
                                <div className="border-t-[3px] border-slate-800 pt-2 text-[10px] font-black uppercase tracking-widest text-slate-900 w-full text-center">Authorized Signature</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 3. Saved Quotes (CRM) ---
        function SavedQuotes({ quotes, loadQuote, deleteQuote, updateQuoteStatus }) {
            const [searchTerm, setSearchTerm] = useState('');
            const filteredQuotes = quotes.filter(q => (q.customer.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (q.customer.phone || '').includes(searchTerm) || q.id.includes(searchTerm));

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3"><span className="glass-gradient text-white p-2 rounded-xl shadow">💾</span> Client CRM & Drafts</h2>
                        <input type="text" placeholder="Search Name, Phone, ID..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full md:w-80 p-3 border-2 border-slate-200 rounded-xl font-bold text-sm focus:border-indigo-500 outline-none shadow-sm"/>
                    </div>
                    {filteredQuotes.length === 0 ? <div className="bg-white py-20 rounded-3xl shadow-sm border border-slate-200 text-center font-bold text-slate-400">No records found.</div> : (
                        <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                            {filteredQuotes.map(q => (
                                <div key={q.id} className="bg-white p-6 rounded-3xl border border-slate-200 hover:shadow-xl hover:border-indigo-300 transition-all relative flex flex-col">
                                    <button onClick={()=>deleteQuote(q.id)} className="absolute top-5 right-5 text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-full w-8 h-8 flex justify-center items-center font-bold transition">X</button>
                                    <div className="flex gap-2 items-center mb-4">
                                        <span className="bg-indigo-50 text-indigo-800 text-[9px] font-black uppercase px-2.5 py-1 rounded-md tracking-widest border border-indigo-100">#INV-{q.id.slice(-5)}</span>
                                        <select value={q.status || 'Pending'} onChange={(e) => updateQuoteStatus(q.id, e.target.value)} className="text-[9px] font-black uppercase px-2 py-1 rounded-md outline-none border cursor-pointer bg-slate-50 border-slate-200"><option value="Pending">Pending</option><option value="Approved">Approved</option><option value="Completed">Completed</option><option value="Cancelled">Cancelled</option></select>
                                    </div>
                                    <h3 className="font-black text-xl text-slate-800 mb-1 truncate uppercase pr-6">{q.customer.name || 'Walk-in Customer'}</h3>
                                    <p className="text-[10px] font-bold text-slate-400 mb-4">{q.timestamp}</p>
                                    <button onClick={()=>loadQuote(q)} className="mt-auto w-full bg-slate-900 text-white text-[11px] font-black uppercase tracking-widest py-3 rounded-xl hover:bg-indigo-600 transition shadow">Open / Edit Invoice</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- 4. Settings Component ---
        function Settings({ initialRates, initialCompany, updateSettings }) {
            const [localR, setLocalR] = useState(initialRates);
            const [localC, setLocalC] = useState(initialCompany);

            const handleSave = () => { let parsedRates = {}; for(let k in localR) parsedRates[k] = parseFloat(localR[k]) || 0; updateSettings(parsedRates, localC); };
            const inputClass = "w-24 p-2.5 border-2 border-slate-200 rounded-xl text-right font-black text-indigo-700 focus:border-indigo-500 focus:bg-white outline-none transition bg-slate-50";
            const rowClass = "flex justify-between items-center py-2 border-b border-slate-100 hover:bg-slate-50 px-2 rounded-lg transition";

            return (
                <div className="max-w-5xl mx-auto pb-10">
                    <div className="glass-gradient p-8 rounded-3xl shadow-xl shadow-indigo-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-5 text-white">
                        <div><h2 className="text-3xl font-black uppercase tracking-widest">⚙️ Enterprise Settings</h2></div>
                        <button onClick={handleSave} className="w-full md:w-auto bg-white text-indigo-900 px-10 py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 text-xs">Save Everything</button>
                    </div>

                    <div className="grid lg:grid-cols-2 gap-8">
                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm h-fit">
                            <h3 className="font-black text-xl mb-6 text-slate-800 uppercase tracking-widest border-b-2 border-indigo-100 pb-3 flex items-center gap-2"><span className="text-2xl">🏢</span> Branding Info</h3>
                            <div className="space-y-4">
                                <div><label className="text-[10px] font-black text-indigo-500 block mb-1 uppercase tracking-wider">Company Logo URL (Optional)</label><input type="text" value={localC.logoUrl || ''} onChange={e=>setLocalC({...localC, logoUrl: e.target.value})} placeholder="https://example.com/logo.png" className="w-full p-3 border-2 border-indigo-100 bg-indigo-50/30 rounded-xl font-medium focus:border-indigo-500 focus:bg-white" /></div>
                                <div><label className="text-[10px] font-black text-slate-500 block mb-1 uppercase tracking-wider">Company Name</label><input type="text" value={localC.name} onChange={e=>setLocalC({...localC, name: e.target.value})} className="w-full p-3 border-2 border-slate-200 bg-slate-50 rounded-xl font-black focus:border-indigo-500 focus:bg-white" /></div>
                                <div><label className="text-[10px] font-black text-slate-500 block mb-1 uppercase tracking-wider">Address</label><input type="text" value={localC.address} onChange={e=>setLocalC({...localC, address: e.target.value})} className="w-full p-3 border-2 border-slate-200 bg-slate-50 rounded-xl font-bold focus:border-indigo-500 focus:bg-white" /></div>
                                <div><label className="text-[10px] font-black text-slate-500 block mb-1 uppercase tracking-wider">Phone</label><input type="text" value={localC.phone} onChange={e=>setLocalC({...localC, phone: e.target.value})} className="w-full p-3 border-2 border-slate-200 bg-slate-50 rounded-xl font-bold focus:border-indigo-500 focus:bg-white" /></div>
                                <div><label className="text-[10px] font-black text-slate-500 block mb-1 uppercase tracking-wider">Invoice Terms (Notes)</label><textarea value={localC.notes} onChange={e=>setLocalC({...localC, notes: e.target.value})} className="w-full p-3 border-2 border-slate-200 bg-slate-50 rounded-xl font-bold text-xs focus:border-indigo-500 focus:bg-white leading-relaxed" rows="4"></textarea></div>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 className="font-black text-lg mb-4 text-slate-800 uppercase tracking-widest border-b-2 border-indigo-100 pb-2">Glass Rates <span className="text-[9px] text-slate-400 font-bold bg-slate-100 px-2 py-1 rounded ml-2">Per Sq.Ft</span></h3>
                                <div className="space-y-1 text-xs font-bold text-slate-600">
                                    <div className={rowClass}><span>12mm Clear</span><input type="number" value={localR.glass12mm} onChange={e=>setLocalR({...localR, glass12mm: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>8mm Clear</span><input type="number" value={localR.glass8mm} onChange={e=>setLocalR({...localR, glass8mm: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>6mm Clear</span><input type="number" value={localR.glass6mm} onChange={e=>setLocalR({...localR, glass6mm: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Tempering Extra</span><input type="number" value={localR.tempering} onChange={e=>setLocalR({...localR, tempering: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Frosting Extra</span><input type="number" value={localR.design} onChange={e=>setLocalR({...localR, design: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Glass Paper Extra</span><input type="number" value={localR.glassPaper} onChange={e=>setLocalR({...localR, glassPaper: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Fixing/Labour</span><input type="number" value={localR.labour} onChange={e=>setLocalR({...localR, labour: e.target.value})} className={inputClass} /></div>
                                </div>
                            </div>
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 className="font-black text-lg mb-4 text-slate-800 uppercase tracking-widest border-b-2 border-indigo-100 pb-2">Aluminum Profiles <span className="text-[9px] text-slate-400 font-bold bg-slate-100 px-2 py-1 rounded ml-2">Running Ft.</span></h3>
                                <div className="space-y-1 text-xs font-bold text-slate-600">
                                    <div className={rowClass}><span>D48-A Profile</span><input type="number" value={localR.profileD48A} onChange={e=>setLocalR({...localR, profileD48A: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>D48-B Profile</span><input type="number" value={localR.profileD48B} onChange={e=>setLocalR({...localR, profileD48B: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>D48 Standard</span><input type="number" value={localR.profileD48} onChange={e=>setLocalR({...localR, profileD48: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>U-Gola Profile</span><input type="number" value={localR.profileUGola} onChange={e=>setLocalR({...localR, profileUGola: e.target.value})} className={inputClass} /></div>
                                </div>
                            </div>
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 className="font-black text-lg mb-4 text-slate-800 uppercase tracking-widest border-b-2 border-indigo-100 pb-2">Hardware <span className="text-[9px] text-slate-400 font-bold bg-slate-100 px-2 py-1 rounded ml-2">Per Piece/Tube</span></h3>
                                <div className="space-y-1 text-xs font-bold text-slate-600">
                                    <div className={rowClass}><span>Floor Machine</span><input type="number" value={localR.machine} onChange={e=>setLocalR({...localR, machine: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>L-Patch Bracket</span><input type="number" value={localR.lPatch} onChange={e=>setLocalR({...localR, lPatch: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Door Handle</span><input type="number" value={localR.handle} onChange={e=>setLocalR({...localR, handle: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Door Lock</span><input type="number" value={localR.lock} onChange={e=>setLocalR({...localR, lock: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Glass Joint (G-G)</span><input type="number" value={localR.ggJoint} onChange={e=>setLocalR({...localR, ggJoint: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Wall Joint (W-G)</span><input type="number" value={localR.wgJoint} onChange={e=>setLocalR({...localR, wgJoint: e.target.value})} className={inputClass} /></div>
                                    <div className={rowClass}><span>Silicone Tube</span><input type="number" value={localR.silicone} onChange={e=>setLocalR({...localR, silicone: e.target.value})} className={inputClass} /></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
